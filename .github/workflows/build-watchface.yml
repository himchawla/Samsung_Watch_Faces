name: Build watch face APKs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: this image ships an Android SDK; ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # publish the rolling "latest" release on main
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 and build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "No preinstalled cmdline-tools in $SDK; downloading them."
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
            mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preflight all faces
        run: python3 tools/verify.py

      - name: Build every face
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs as dist/<face-id>.apk
        run: |
          mkdir -p dist
          for dir in faces/*/; do
            id=$(basename "$dir")
            apk=$(ls "$dir"build/outputs/apk/debug/*.apk | head -1)
            cp "$apk" "dist/$id.apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: watch-face-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # The installer web UI downloads releases/download/latest/<face-id>.apk.
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest watch faces" \
            --notes "Debug APKs built from ${GITHUB_SHA::7}. Install with installer/server.py or adb install -r."
